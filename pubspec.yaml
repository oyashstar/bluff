name: finsys_tracker
description: Finsys Internal Tracker — implementation & client-query tracker (experimental, internal).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  # Uses withValues() and DropdownButtonFormField.initialValue (Flutter 3.35+).
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Backend: Supabase only. No Oracle package, no database connection string.
  supabase_flutter: ^2.8.0
  # State + routing, as mandated by the brief.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  # Attachment picking for the query screen (bytes -> Supabase Storage).
  file_picker: ^8.1.4
  # Persist the theme-mode choice (system / light / dark).
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/finsys_logo.png
